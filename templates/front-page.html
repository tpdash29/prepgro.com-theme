<!-- wp:group {"tagName":"main","anchor":"pgt-main","layout":{"type":"default"}} -->
<main id="pgt-main" class="wp-block-group">

  <!-- The front page talks about this country, the visitor's state and that
       state's tests, and its main action is exam practice (owner rules,
       2026-09-14). Every section below is rendered by the engine
       (Core\Journey\Home_Page) from the papers this site publishes, so no
       exam name or number is typed here. The same template serves the
       country view at / and each state's homepage at
       /learn/{country}/{state}/. Photos come from Customize → PrepGro
       Images (the "Homepage …" slots, each with an AI prompt); until one is
       uploaded a visitor sees the section without it. The whole-product
       story that used to be here is at /how-prepgro-works/. -->

  <!-- 1. Hero: country (or state) kicker, the state test headline, the state
       picker. The pack's landmark skyline stays behind it. -->
  <!-- wp:html -->
  <section class="pgh-hero pgh-hero--exam" id="pg-hero">
    [pge_home_hero]
    [pgt_hero_skyline]
  </section>
  <!-- /wp:html -->

  <!-- 2. Counts: papers, states, state tests, grades. -->
  <!-- wp:html -->
  <section class="pgh-trust">
    [pge_home_trust]
  </section>
  <!-- /wp:html -->

  <!-- 3. At a glance (infographic): the country's testing road with papers
       by subject, or the state's grade-by-subject map of its tests. -->
  <!-- wp:html -->
  <section class="pgh-section pgh-section--glance" id="pg-glance">
    [pge_home_glance]
  </section>
  <!-- /wp:html -->

  <!-- 4. The tests: every state and the national tests (country view), or one
       state's tests grade by grade with every paper linked (state view). -->
  <!-- wp:html -->
  <section class="pgh-section pgh-section--tests pgh-section--flush">
    [pge_home_tests]
  </section>
  <!-- /wp:html -->

  <!-- 5. How practice works: three numbered steps beside a photo. -->
  <!-- wp:html -->
  <section class="pgh-section pgh-section--flush" id="pg-how">
    [pge_home_practice]
  </section>
  <!-- /wp:html -->

  <!-- 6. Support for the exam, one card per module: Evaluate (the optional
       skills check), Elevate (lessons and tutors), Excel (unlimited
       practice); links to How prepGro works. -->
  <!-- wp:html -->
  <section class="pgh-section pgh-section--flush" id="pg-support">
    [pge_home_support]
  </section>
  <!-- /wp:html -->

  <!-- 7. Closing band: a proverb, one encouraging line, the next step. -->
  <!-- wp:html -->
  <section class="pgh-section pgh-section--flush" id="pg-start">
    [pge_home_cta]
  </section>
  <!-- /wp:html -->

  <!-- 8. FAQ, with FAQPage JSON-LD, plus ItemList / BreadcrumbList. -->
  <!-- wp:html -->
  <section class="pgh-section pgh-section--tight" id="pg-faq">
    [pge_home_faq]
  </section>
  <!-- /wp:html -->

</main>
<!-- /wp:group -->

<!-- wp:template-part {"slug":"footer","area":"footer","tagName":"footer"} /-->
